x-business-rules:
  available_copies: Сервер вычисляет total_copies минус активные выдачи; клиент не передаёт available_copies.
  availability: Выдавать можно только при available_copies > 0.
  reader_limit: Не более 5 активных выдач на читателя; активная означает returned_at == null.
  return: POST /loans/{id}/return; повторный возврат не меняет returned_at и остаток повторно.
  overdue: returned_at == null и due_date < текущей календарной даты UTC.
  deletion: Удаление книги или читателя с активной выдачей запрещено.
  due_date: Для новой выдачи due_date > текущей календарной даты UTC.
  atomicity: Остаток, лимит читателя, создание выдачи и запись replay согласованы атомарно.
x-idempotency-policy:
  ttl_hours: 24
  scope:
  - method
  - path
  - Idempotency-Key
  request_fingerprint: Нормализованные book_id, reader_id, due_date; порядок ключей и пробелы JSON незначимы.
  replay: Тот же статус, байты тела и прикладные заголовки; меняется только Idempotency-Replayed.
  mismatch: 409 IDEMPOTENCY_MISMATCH
  concurrent: '409 CONFLICT, idempotency_in_progress, Retry-After: 1; выдача не дублируется.'
  expiry: Через 24 часа после завершения ключ можно использовать как новый.
  failure: 5xx до commit не кэшируется; операция откатывается. После commit ответ уже сохранён.
